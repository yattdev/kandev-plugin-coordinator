id: "kandev-plugin-coordinator"
api_version: 1
version: "0.1.0"
display_name: "Coordinator"
description: "Long-lived board orchestration with a native workspace conversation."
author: "yattdev"
categories: ["automation", "tools"]
min_kandev_version: "0.88.0"
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"
capabilities:
  state: true
  api_read: [workspaces, workflows]
  api_write: [tasks, messages]
actions:
  - key: "coordinator.status"
    scope: workspace
    max_body_bytes: 1024
  - key: "coordinator.report"
    scope: workspace
    max_body_bytes: 65536
  - key: "coordinator.workflow-policy"
    scope: workspace
    max_body_bytes: 65536
agent_tools:
  - name: coordinator_status
    description: "Read coordinator schedule and last persisted report."
    surfaces: [kanban-task, office-task]
    input_schema: {type: object, additionalProperties: false}
    annotations: {read_only_hint: true, idempotent_hint: true}
  - name: coordinator_record_report
    description: "Persist the coordinator's completed daily report."
    surfaces: [kanban-task, office-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [report]
      properties: {report: {type: string}}
    annotations: {read_only_hint: false, idempotent_hint: false}
ui:
  bundle: "/ui/bundle.js"
config_schema:
  type: object
  properties:
    agent_profile: {type: string, format: agent-profile, title: "Coordinator agent profile"}
    base_prompt: {type: string, title: "Default coordinator base prompt", description: "Prepended to every configured workstep check. Safety invariants are always appended."}
    timezone: {type: string, title: "Timezone", default: "America/Montreal"}
    standup_time: {type: string, title: "Weekday standup time", default: "07:55"}
    cycle_interval_minutes: {type: integer, title: "Cycle interval (minutes)", default: 45, minimum: 15, maximum: 240}
