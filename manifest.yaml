id: "kandev-plugin-coordinator"
api_version: 1
version: "0.1.0"
display_name: "Coordinator"
description: "Workspace orchestration through host-managed Coordinator runs."
author: "yattdev"
categories: ["automation", "tools"]
repo_url: "https://github.com/yattdev/kandev-plugin-coordinator"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  state: true
  agent_conversation: true
  api_read: ["workspaces", "workflows", "task_relations", "automations", "workspace_agent_principals"]
  events: ["automation.triggered"]

actions:
  - key: "coordinator.ensure"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "coordinator.status"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "coordinator.reports"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "coordinator.automation-bind"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "coordinator.automations"
    scope: "workspace"
    max_body_bytes: 1024

agent_tools:
  - name: get_coordinator_state
    description: "Read the bounded coordinator memory for the verified workspace."
    surfaces: ["kanban-task", "office-task"]
    input_schema:
      type: object
      additionalProperties: false
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: publish_report
    description: "Atomically publish a typed report and replace coordinator memory for the verified workspace."
    surfaces: ["kanban-task", "office-task"]
    input_schema:
      type: object
      additionalProperties: false
      required: ["type", "title", "body", "state"]
      properties:
        type:
          type: string
          enum: ["cycle", "daily", "status"]
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
        trigger:
          type: string
          enum: ["cycle", "standup"]
        occurrence_key:
          type: string
        state:
          type: object
          additionalProperties: false
          properties:
            active_flags: {type: array}
            task_snapshots: {type: object}
            degradations: {type: array}
            cycle_log: {type: object}
            runs: {type: array, maxItems: 100}
            follow_ups: {type: array, maxItems: 200}
            inbox: {type: array, maxItems: 200}
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false

ui:
  bundle: "/ui/bundle.js"

config_schema:
  type: object
  additionalProperties: false
  properties:
    agent_profile:
      type: string
      format: agent-profile
      title: "Coordinator agent profile"
      description: "Optional override. When empty, the workspace default agent profile is used."
    base_prompt:
      type: string
      title: "Coordinator base prompt"
      description: "Prepended to each run. Fixed safety invariants are always appended."
    report_template:
      type: string
      title: "Daily report template"
